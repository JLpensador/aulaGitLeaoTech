<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopBlue</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <style>
        :root {
            --azul: #1a3f7a;
            --azul-medio: #2357a8;
            --azul-claro: #3a75d4;
            --dourado: #c9a227;
            --dourado-vivo: #f0c040;
            --fundo: #f0f4fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--fundo);
            font-family: 'Georgia', serif;
        }

        /* ── Navbar ── */
        .navbar {
            background: var(--azul) !important;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .3);
        }

        .navbar-brand {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--dourado-vivo) !important;
            letter-spacing: 2px;
        }

        #btn-carrinho {
            background: transparent;
            border: 1.5px solid var(--dourado);
            color: var(--dourado-vivo);
            font-weight: 600;
            border-radius: 8px;
            padding: 6px 16px;
            transition: background .2s;
            position: relative;
        }

        #btn-carrinho:hover {
            background: rgba(201, 162, 39, .15);
        }

        #badge-qtd {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--dourado);
            color: #1a1a1a;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: .7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Hero ── */
        .hero {
            background: linear-gradient(135deg, var(--azul) 55%, var(--azul-medio));
            padding: 3.5rem 1rem 2.5rem;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--dourado-vivo);
            letter-spacing: 1px;
            margin-bottom: .5rem;
        }

        .hero p {
            opacity: .8;
            font-size: 1.05rem;
        }

        #busca {
            max-width: 420px;
            margin: 1.2rem auto 0;
            border-radius: 30px;
            border: none;
            padding: 10px 20px;
            font-size: .95rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
        }

        #busca:focus {
            outline: 2px solid var(--dourado-vivo);
        }

        /* ── Filtros ── */
        .filtros {
            margin: 1.5rem 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-cat {
            border: 1.5px solid var(--azul-claro);
            color: var(--azul);
            background: white;
            border-radius: 20px;
            padding: 4px 16px;
            font-size: .85rem;
            cursor: pointer;
            transition: all .2s;
            text-transform: capitalize;
        }

        .btn-cat:hover,
        .btn-cat.ativo {
            background: var(--azul);
            color: var(--dourado-vivo);
            border-color: var(--azul);
        }

        /* ── Cards de produto ── */
        .card-produto {
            background: white;
            border-radius: 14px;
            border: 1px solid #dde3ef;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .2s, box-shadow .2s;
            animation: fadeIn .4s ease both;
        }

        .card-produto:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(26, 63, 122, .18);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-img-wrap {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
            background: #fafbff;
        }

        .card-img-wrap img {
            max-height: 160px;
            max-width: 100%;
            object-fit: contain;
            transition: transform .25s;
        }

        .card-img-wrap:hover img {
            transform: scale(1.06);
        }

        .card-body-custom {
            padding: 14px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .badge-cat {
            display: inline-block;
            background: #e8effc;
            color: var(--azul-medio);
            font-size: .7rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            text-transform: capitalize;
            width: fit-content;
        }

        .nome-produto {
            font-size: .92rem;
            font-weight: 600;
            color: #1a1a2e;
            line-height: 1.4;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .avaliacao {
            font-size: .8rem;
            color: #888;
        }

        .avaliacao span {
            color: var(--dourado);
        }

        .preco-linha {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .preco {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--azul);
        }

        .btn-add {
            background: var(--dourado);
            border: none;
            color: #1a1a1a;
            font-weight: 700;
            font-size: .8rem;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s;
        }

        .btn-add:hover {
            background: var(--dourado-vivo);
        }

        /* ── Loading skeleton ── */
        .skeleton {
            background: linear-gradient(90deg, #e0e7f3 25%, #cdd6ec 50%, #e0e7f3 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .skel-card {
            height: 320px;
            border-radius: 14px;
        }

        /* ── Offcanvas carrinho ── */
        .offcanvas-header {
            background: var(--azul);
        }

        .offcanvas-title {
            color: var(--dourado-vivo);
            font-weight: 700;
        }

        .btn-close-white {
            filter: invert(1);
        }

        .item-cart {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .item-cart img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            border-radius: 6px;
            background: #f5f7ff;
            padding: 4px;
        }

        .item-cart-info {
            flex: 1;
            min-width: 0;
        }

        .item-cart-info .nome {
            font-size: .85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-cart-info .sub-preco {
            color: var(--azul);
            font-weight: 700;
            font-size: .9rem;
        }

        .qtd-ctrl {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qtd-ctrl button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--azul-claro);
            background: white;
            color: var(--azul);
            font-weight: 700;
            cursor: pointer;
            font-size: .9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        .qtd-ctrl button:hover {
            background: #e8effc;
        }

        .qtd-ctrl .num {
            min-width: 20px;
            text-align: center;
            font-weight: 600;
        }

        .btn-remover {
            background: none;
            border: none;
            color: #c0392b;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 4px;
        }

        .total-box {
            background: var(--azul);
            color: white;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .total-box .valor {
            color: var(--dourado-vivo);
            font-size: 1.2rem;
            font-weight: 700;
        }

        #btn-finalizar {
            width: 100%;
            margin-top: 10px;
            background: var(--dourado);
            border: none;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s;
        }

        #btn-finalizar:hover {
            background: var(--dourado-vivo);
        }

        #carrinho-vazio {
            text-align: center;
            color: #aaa;
            margin-top: 3rem;
            font-size: 1rem;
        }

        /* ── Modal produto ── */
        .modal-header {
            background: var(--azul);
            color: var(--dourado-vivo);
        }

        .modal-header .btn-close {
            filter: invert(1);
        }

        #modal-img {
            max-height: 220px;
            object-fit: contain;
            background: #fafbff;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
        }

        #modal-preco {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--azul);
        }

        #modal-avaliacao {
            color: #888;
            font-size: .85rem;
        }

        #modal-avaliacao span {
            color: var(--dourado);
        }

        #modal-desc {
            font-size: .88rem;
            color: #555;
            line-height: 1.6;
        }

        .qtd-modal {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .qtd-modal button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--azul-claro);
            background: white;
            color: var(--azul);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qtd-modal .num {
            min-width: 24px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
        }

        #btn-modal-add {
            background: var(--dourado);
            border: none;
            color: #1a1a1a;
            font-weight: 700;
            padding: 8px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s;
        }

        #btn-modal-add:hover {
            background: var(--dourado-vivo);
        }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--azul);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: .9rem;
            z-index: 9999;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity .3s, transform .3s;
            pointer-events: none;
            border-left: 4px solid var(--dourado);
        }

        #toast.ativo {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Responsivo ── */
        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark sticky-top">
        <div class="container">
            <span class="navbar-brand">🛍 ShopBlue</span>
            <button id="btn-carrinho">
                🛒 Carrinho
                <span id="badge-qtd" style="display:none">0</span>
            </button>
        </div>
    </nav>

    <!-- HERO -->
    <div class="hero">
        <h1>Bem-vindo à ShopBlue</h1>
        <p>Produtos reais, preços reais — direto da FakeStore API</p>
        <input type="text" id="busca" placeholder="🔍 Buscar produto..." />
    </div>

    <!-- CONTEÚDO -->
    <div class="container my-4">
        <div class="filtros" id="filtros">
            <button class="btn-cat ativo" data-cat="todos">Todos</button>
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="grid-produtos">
            <!-- skeletons enquanto carrega -->
            <div class="col">
                <div class="skeleton skel-card"></div>
            </div>
            <div class="col">
                <div class="skeleton skel-card"></div>
            </div>
            <div class="col">
                <div class="skeleton skel-card"></div>
            </div>
            <div class="col">
                <div class="skeleton skel-card"></div>
            </div>
            <div class="col">
                <div class="skeleton skel-card"></div>
            </div>
            <div class="col">
                <div class="skeleton skel-card"></div>
            </div>
            <div class="col">
                <div class="skeleton skel-card"></div>
            </div>
            <div class="col">
                <div class="skeleton skel-card"></div>
            </div>
        </div>
    </div>

    <!-- OFFCANVAS CARRINHO -->
    <div class="offcanvas offcanvas-end" id="offcanvas-carrinho" style="width:380px">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">🛒 Meu Carrinho</h5>
            <button class="btn-close btn-close-white" id="btn-fechar-carrinho"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="lista-carrinho" class="flex-grow-1 overflow-auto"></div>
            <p id="carrinho-vazio">Carrinho vazio 😢<br><small>Adicione alguns produtos!</small></p>
            <div id="rodape-carrinho" style="display:none">
                <div class="total-box">
                    <span>Total:</span>
                    <span class="valor" id="total-preco">R$ 0,00</span>
                </div>
                <button id="btn-finalizar">Finalizar Compra ✔</button>
            </div>
        </div>
    </div>
    <div class="offcanvas-backdrop fade" id="backdrop" style="display:none"></div>

    <!-- MODAL PRODUTO -->
    <div class="modal fade" id="modal-produto" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-titulo">Produto</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img id="modal-img" src="" alt="" class="mb-3" />
                    <div id="modal-avaliacao" class="mb-1"></div>
                    <div id="modal-preco" class="mb-2"></div>
                    <p id="modal-desc"></p>
                    <div class="qtd-modal">
                        <span class="fw-semibold">Quantidade:</span>
                        <button id="qtd-menos">−</button>
                        <span class="num" id="qtd-num">1</span>
                        <button id="qtd-mais">+</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Fechar</button>
                    <button id="btn-modal-add">+ Adicionar ao carrinho</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        // ─── Estado global ───────────────────────────────────────────
        let produtos = [];       // todos os produtos da API
        let carrinho = [];       // { ...produto, qtd }
        let catAtiva = 'todos';
        let termoBusca = '';
        let modalProduto = null;     // produto aberto no modal
        let modalQtd = 1;

        // ─── Elementos ───────────────────────────────────────────────
        const grid = document.getElementById('grid-produtos');
        const filtrosEl = document.getElementById('filtros');
        const buscaInput = document.getElementById('busca');
        const btnCarrinho = document.getElementById('btn-carrinho');
        const badgeQtd = document.getElementById('badge-qtd');
        const offcanvas = document.getElementById('offcanvas-carrinho');
        const backdrop = document.getElementById('backdrop');
        const btnFechar = document.getElementById('btn-fechar-carrinho');
        const listaCarrinho = document.getElementById('lista-carrinho');
        const carrinhoVazio = document.getElementById('carrinho-vazio');
        const rodapeCarr = document.getElementById('rodape-carrinho');
        const totalPrecoEl = document.getElementById('total-preco');
        const btnFinalizar = document.getElementById('btn-finalizar');
        const toast = document.getElementById('toast');
        const modalBS = new bootstrap.Modal(document.getElementById('modal-produto'));

        // ─── API ─────────────────────────────────────────────────────
        async function carregarProdutos() {
            try {
                const res = await fetch('https://fakestoreapi.com/products');
                produtos = await res.json();
                montarFiltros();
                renderProdutos();
            } catch (e) {
                grid.innerHTML = '<p class="text-center text-danger mt-4 col">Erro ao carregar produtos. Tente recarregar a página.</p>';
            }
        }

        // ─── Filtros de categoria ─────────────────────────────────────
        function montarFiltros() {
            const cats = ['todos', ...new Set(produtos.map(p => p.category))];
            filtrosEl.innerHTML = cats.map(cat =>
                `<button class="btn-cat ${cat === catAtiva ? 'ativo' : ''}" data-cat="${cat}">${cat}</button>`
            ).join('');

            filtrosEl.querySelectorAll('.btn-cat').forEach(btn => {
                btn.addEventListener('click', () => {
                    catAtiva = btn.dataset.cat;
                    filtrosEl.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    renderProdutos();
                });
            });
        }

        // ─── Renderização dos cards ───────────────────────────────────
        function renderProdutos() {
            const filtrados = produtos.filter(p => {
                const matchCat = catAtiva === 'todos' || p.category === catAtiva;
                const matchBusca = p.title.toLowerCase().includes(termoBusca.toLowerCase());
                return matchCat && matchBusca;
            });

            if (filtrados.length === 0) {
                grid.innerHTML = '<p class="text-center text-muted col mt-4">Nenhum produto encontrado.</p>';
                return;
            }

            grid.innerHTML = filtrados.map((p, i) => `
    <div class="col" style="animation-delay:${i * 0.05}s">
      <div class="card-produto h-100">
        <div class="card-img-wrap" data-id="${p.id}">
          <img src="${p.image}" alt="${p.title}" loading="lazy" />
        </div>
        <div class="card-body-custom">
          <span class="badge-cat">${p.category}</span>
          <div class="nome-produto">${p.title}</div>
          <div class="avaliacao">
            <span>★</span> ${p.rating.rate} (${p.rating.count} avaliações)
          </div>
          <div class="preco-linha">
            <span class="preco">${formatPreco(p.price)}</span>
            <button class="btn-add" data-id="${p.id}">+ Adicionar</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');

            // eventos dos cards
            grid.querySelectorAll('.card-img-wrap').forEach(el => {
                el.addEventListener('click', () => abrirModal(Number(el.dataset.id)));
            });
            grid.querySelectorAll('.btn-add').forEach(btn => {
                btn.addEventListener('click', () => adicionarAoCarrinho(Number(btn.dataset.id), 1));
            });
        }

        // ─── Busca ────────────────────────────────────────────────────
        buscaInput.addEventListener('input', () => {
            termoBusca = buscaInput.value;
            renderProdutos();
        });

        // ─── Modal produto ────────────────────────────────────────────
        function abrirModal(id) {
            modalProduto = produtos.find(p => p.id === id);
            modalQtd = 1;
            document.getElementById('modal-titulo').textContent = modalProduto.title;
            document.getElementById('modal-img').src = modalProduto.image;
            document.getElementById('modal-img').alt = modalProduto.title;
            document.getElementById('modal-preco').textContent = formatPreco(modalProduto.price);
            document.getElementById('modal-desc').textContent = modalProduto.description;
            document.getElementById('modal-avaliacao').innerHTML =
                `<span>★</span> ${modalProduto.rating.rate} — ${modalProduto.rating.count} avaliações`;
            document.getElementById('qtd-num').textContent = 1;
            modalBS.show();
        }

        document.getElementById('qtd-menos').addEventListener('click', () => {
            if (modalQtd > 1) { modalQtd--; document.getElementById('qtd-num').textContent = modalQtd; }
        });
        document.getElementById('qtd-mais').addEventListener('click', () => {
            modalQtd++; document.getElementById('qtd-num').textContent = modalQtd;
        });
        document.getElementById('btn-modal-add').addEventListener('click', () => {
            adicionarAoCarrinho(modalProduto.id, modalQtd);
            modalBS.hide();
        });

        // ─── Carrinho ─────────────────────────────────────────────────
        function adicionarAoCarrinho(id, qtd) {
            const produto = produtos.find(p => p.id === id);
            const existe = carrinho.find(i => i.id === id);
            if (existe) {
                existe.qtd += qtd;
            } else {
                carrinho.push({ ...produto, qtd });
            }
            atualizarCarrinho();
            mostrarToast(`"${produto.title.slice(0, 30)}..." adicionado!`);
        }

        function removerItem(id) {
            carrinho = carrinho.filter(i => i.id !== id);
            atualizarCarrinho();
        }

        function alterarQtd(id, delta) {
            const item = carrinho.find(i => i.id === id);
            if (!item) return;
            item.qtd = Math.max(1, item.qtd + delta);
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            // badge navbar
            const totalItens = carrinho.reduce((a, i) => a + i.qtd, 0);
            if (totalItens > 0) {
                badgeQtd.style.display = 'flex';
                badgeQtd.textContent = totalItens;
            } else {
                badgeQtd.style.display = 'none';
            }

            // lista offcanvas
            if (carrinho.length === 0) {
                listaCarrinho.innerHTML = '';
                carrinhoVazio.style.display = 'block';
                rodapeCarr.style.display = 'none';
                return;
            }

            carrinhoVazio.style.display = 'none';
            rodapeCarr.style.display = 'block';

            listaCarrinho.innerHTML = carrinho.map(item => `
    <div class="item-cart">
      <img src="${item.image}" alt="${item.title}" />
      <div class="item-cart-info">
        <div class="nome">${item.title}</div>
        <div class="sub-preco">${formatPreco(item.price * item.qtd)}</div>
        <div class="qtd-ctrl mt-1">
          <button onclick="alterarQtd(${item.id}, -1)">−</button>
          <span class="num">${item.qtd}</span>
          <button onclick="alterarQtd(${item.id}, +1)">+</button>
        </div>
      </div>
      <button class="btn-remover" onclick="removerItem(${item.id})">🗑</button>
    </div>
  `).join('');

            const total = carrinho.reduce((a, i) => a + i.price * i.qtd, 0);
            totalPrecoEl.textContent = formatPreco(total);
        }

        // ─── Offcanvas manual ─────────────────────────────────────────
        function abrirCarrinho() {
            offcanvas.classList.add('show');
            offcanvas.style.visibility = 'visible';
            backdrop.style.display = 'block';
            setTimeout(() => backdrop.classList.add('show'), 10);
        }

        function fecharCarrinho() {
            offcanvas.classList.remove('show');
            backdrop.classList.remove('show');
            setTimeout(() => {
                offcanvas.style.visibility = 'hidden';
                backdrop.style.display = 'none';
            }, 300);
        }

        btnCarrinho.addEventListener('click', abrirCarrinho);
        btnFechar.addEventListener('click', fecharCarrinho);
        backdrop.addEventListener('click', fecharCarrinho);

        // ─── Finalizar compra ─────────────────────────────────────────
        btnFinalizar.addEventListener('click', () => {
            fecharCarrinho();
            setTimeout(() => {
                alert('🎉 Pedido realizado com sucesso!\nObrigado por comprar na ShopBlue!');
                carrinho = [];
                atualizarCarrinho();
            }, 350);
        });

        // ─── Toast ────────────────────────────────────────────────────
        let toastTimer;
        function mostrarToast(msg) {
            clearTimeout(toastTimer);
            toast.textContent = '✅ ' + msg;
            toast.classList.add('ativo');
            toastTimer = setTimeout(() => toast.classList.remove('ativo'), 2800);
        }

        // ─── Utilitário ───────────────────────────────────────────────
        function formatPreco(valor) {
            return 'R$ ' + (valor * 5.1).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // ─── Init ─────────────────────────────────────────────────────
        carregarProdutos();

    </script>
</body>

</html>
